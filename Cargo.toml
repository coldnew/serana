[workspace]
resolver = "2"
members = [
    "crates/serana-core",
    "crates/serana-llm",
    "crates/serana-lsp",
    "crates/serana-tree-sitter",
    "crates/serana-tools",
    "crates/serana-agent",
    "crates/serana-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["coldnew"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossterm = "0.28"
parking_lot = "0.12"
dirs = "5.0"
textwrap = "0.16"
strip-ansi-escapes = "0.2"
pulldown-cmark = "0.12"
pin-project-lite = "0.2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = "0.32"
uuid = { version = "1.0", features = ["v4"] }
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go = "0.21"
ratatui = "0.28"
futures = "0.3"
bytes = "1.7"
async-stream = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[package]
name = "serana"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Personal coding agent"

[dependencies]
serana-core = { path = "crates/serana-core" }
serana-llm = { path = "crates/serana-llm" }
serana-lsp = { path = "crates/serana-lsp" }
serana-tree-sitter = { path = "crates/serana-tree-sitter" }
serana-tools = { path = "crates/serana-tools" }
serana-agent = { path = "crates/serana-agent" }
serana-tui = { path = "crates/serana-tui" }
tokio.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile = "3.12"
