[workspace]
resolver = "2"
members = [
    "crates/mora-core",
    "crates/mora-lisp",
    "crates/mora-compile",
    "crates/mishell-parser",
    "crates/display-protocol",
    "crates/display-protocol-jsx",
    "crates/display-protocol-rsx",
    "crates/display-tui",
    "mishell",
    "mora",
    "serana",
    "vivi",
    "crates/serana-core",
    "crates/serana-llm",
    "crates/serana-tree-sitter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["coldnew"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossterm = "0.28"
parking_lot = "0.12"
dirs = "5.0"
textwrap = "0.16"
strip-ansi-escapes = "0.2"
pulldown-cmark = "0.12"
pin-project-lite = "0.2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = "0.32"
uuid = { version = "1.0", features = ["v4"] }
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go = "0.21"
ratatui = "0.28"
futures = "0.3"
bytes = "1.7"
async-stream = "0.3"
syntect = "5.2"
regex = "1.10"
glob = "0.3"
ignore = "0.4"
wgpu = "29"
winit = "0.30"
cosmic-text = "0.12"
glyphon = "0.11"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1.10"

[workspace.lints.rust]
unsafe_code = "deny"
